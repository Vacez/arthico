name: arthico_app
description: A new Flutter project.
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  fl_chart: ^1.1.1
  intl: ^0.20.2
  google_sign_in: ^6.2.2
  app_links: ^3.5.0
  pdf: ^3.10.1
  printing: ^5.10.0
  excel: ^2.1.0
  path_provider: ^2.1.2
  file_saver: ^0.2.14
  provider: ^6.1.0
  share_plus: ^13.1.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
